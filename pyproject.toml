[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-power-analysis"
version = "0.1.0"
description = "Statistical analysis of the rated maximum power of discrete GPUs (MT2013, HCMUT)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0",
    "pyarrow>=18",  # Parquet keeps column dtypes between pipeline steps
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D", "PD", "PTH", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Numbered pipeline scripts are run directly, never imported.
"scripts/*" = ["N999"]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
